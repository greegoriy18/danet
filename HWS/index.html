<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отчет по выполненной работе</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            background: #008080; font-family: -apple-system, sans-serif;
            transition: background 0.8s ease; touch-action: none;
        }
        .window {
            background: #f0f0f0; border: 1px solid #000; box-shadow: 2px 2px 20px rgba(0,0,0,0.5);
            width: 90%; max-width: 340px; border-radius: 6px; overflow: hidden; transition: opacity 0.5s ease;
        }
        .title-bar {
            background: linear-gradient(to right, #0058ee, #3682ff); color: white;
            padding: 10px 14px; font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn {
            background: #e81123; border: none; color: white; width: 24px; height: 24px;
            font-size: 16px; line-height: 22px; text-align: center; cursor: pointer; border-radius: 3px;
        }
        .content {
            padding: 25px 18px; display: flex; align-items: center; gap: 15px;
            font-size: 17px; color: #000; border-bottom: 1px solid #dfdfdf;
        }
        .icon { font-size: 40px; }
        .buttons { padding: 18px 18px 22px; display: flex; justify-content: flex-end; gap: 12px; }
        .btn {
            padding: 10px 22px; font-size: 16px; cursor: pointer; background: #e1e1e1;
            border: 1px solid #adadad; border-radius: 5px; min-width: 90px; font-weight: 500;
        }
        #yesBtn { background: #0078d7; color: white; border-color: #0078d7; font-weight: bold; }
        #noBtn { position: relative; transition: left 0.25s ease-out, top 0.25s ease-out; }
        #noBtn.running { position: fixed; z-index: 100; }
        
        /* Модальное окно ошибки */
        .error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .error-window {
            background: #f0f0f0; border: 1px solid #000; box-shadow: 2px 2px 20px rgba(0,0,0,0.7);
            width: 90%; max-width: 320px; border-radius: 6px; overflow: hidden;
        }
        .error-title-bar {
            background: linear-gradient(to right, #c5221c, #e8524d); color: white;
            padding: 8px 12px; font-size: 14px; font-weight: bold;
        }
        .error-content {
            padding: 20px; display: flex; align-items: center; gap: 15px;
            font-size: 15px; color: #000;
        }
        .error-icon { font-size: 32px; }
        .error-buttons {
            padding: 12px 20px 16px; display: flex; justify-content: center;
        }
        .error-btn {
            padding: 8px 30px; font-size: 14px; cursor: pointer; background: #e1e1e1;
            border: 1px solid #adadad; border-radius: 4px; font-weight: 500;
        }
        .error-btn:active { background: #b0b0b0; }
        
        /* Финальное окно успеха - теперь ВЫШЕ фейерверка */
        .success-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center;
            z-index: 10001; /* Было 9998, теперь выше фейерверка */
        }
        .success-window {
            background: #f0f0f0; border: 1px solid #000; box-shadow: 2px 2px 30px rgba(0,0,0,0.8);
            width: 90%; max-width: 380px; border-radius: 6px; overflow: hidden;
        }
        .success-title-bar {
            background: linear-gradient(to right, #008542, #00b359); color: white;
            padding: 10px 14px; font-size: 15px; font-weight: bold;
        }
        .success-content {
            padding: 25px 20px; display: flex; align-items: flex-start; gap: 15px;
            font-size: 16px; color: #000; line-height: 1.5;
        }
        .success-icon { font-size: 40px; flex-shrink: 0; }
        .success-buttons {
            padding: 15px 20px 20px; display: flex; justify-content: center;
        }
        .success-btn {
            padding: 10px 25px; font-size: 15px; cursor: pointer; background: #0078d7;
            color: white; border: 1px solid #0078d7; border-radius: 5px; font-weight: bold;
        }
        .success-btn:active { background: #005a9e; }
        
        /* Фейерверк теперь ПОД окном успеха */
        #fireworks { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 9999; display: none; 
        }
    </style>
</head>
<body>
    <div id="dialog" class="window">
        <div class="title-bar">
            <span>Отчет по выполненной работе</span>
            <button class="close-btn">×</button>
        </div>
        <div class="content">
            <div class="icon">📋</div>
            <div>Стас, тебе понравилась выполненная работа?</div>
        </div>
        <div class="buttons">
            <button id="yesBtn" class="btn">Да</button>
            <button id="noBtn" class="btn">Нет</button>
        </div>
    </div>

    <!-- Модальное окно ошибки -->
    <div id="errorOverlay" class="error-overlay">
        <div class="error-window">
            <div class="error-title-bar">Ошибка</div>
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div>Нажмите "Да", чтобы продолжить</div>
            </div>
            <div class="error-buttons">
                <button id="errorOkBtn" class="error-btn">Ок</button>
            </div>
        </div>
    </div>

    <!-- Финальное окно успеха -->
    <div id="successOverlay" class="success-overlay">
        <div class="success-window">
            <div class="success-title-bar">Поздравляем!</div>
            <div class="success-content">
                <div class="success-icon">✅</div>
                <div>Акт выполненных работ по договору оказания услуг заказчиком подписан! Благодарим за сотрудничество!</div>
            </div>
            <div class="success-buttons">
                <button id="continueBtn" class="success-btn">Продолжить сотрудничество</button>
            </div>
        </div>
    </div>

    <canvas id="fireworks"></canvas>

    <script>
        // Убегающая кнопка
        const noBtn = document.getElementById('noBtn');
        let isRunning = false;
        function runAway() {
            if (!isRunning) {
                const rect = noBtn.getBoundingClientRect();
                noBtn.style.width = rect.width + 'px';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.top = rect.top + 'px';
                noBtn.classList.add('running');
                isRunning = true;
            }
            const maxX = window.innerWidth - noBtn.offsetWidth - 10;
            const maxY = window.innerHeight - noBtn.offsetHeight - 10;
            noBtn.style.left = (Math.random() * maxX + 5) + 'px';
            noBtn.style.top = (Math.random() * maxY + 5) + 'px';
        }
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); }, { passive: false });
        noBtn.addEventListener('mouseenter', runAway);
        document.addEventListener('touchmove', (e) => {
            if (!isRunning) return;
            const touch = e.touches[0];
            const rect = noBtn.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + rect.width / 2);
            const dy = touch.clientY - (rect.top + rect.height / 2);
            if (Math.sqrt(dx*dx + dy*dy) < 80) runAway();
        }, { passive: true });

        // Обработка крестика
        document.querySelector('.close-btn').addEventListener('click', () => {
            document.getElementById('errorOverlay').style.display = 'flex';
        });

        // Закрытие окна ошибки
        document.getElementById('errorOkBtn').addEventListener('click', () => {
            document.getElementById('errorOverlay').style.display = 'none';
        });

        // Фейерверк
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];
        
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor(x, y, color, type) {
                this.x = x; this.y = y; this.color = color; this.type = type;
                this.alpha = 1;
                
                if (type === 'rocket') {
                    this.vy = -(Math.random() * 4 + 8);
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.trail = [];
                    this.hasExploded = false;
                } else if (type === 'flash') {
                    const angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle) * (Math.random() * 2 + 1);
                    this.vy = Math.sin(angle) * (Math.random() * 2 + 1);
                    this.radius = Math.random() * 3 + 2;
                    this.decay = 0.08;
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 7 + 3;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.radius = Math.random() * 1.5 + 0.5;
                    this.gravity = 0.12;
                    this.decay = Math.random() * 0.015 + 0.01;
                }
            }

            update() {
                if (this.type === 'rocket') {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 6) this.trail.shift();
                    
                    const prevVy = this.vy;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.1;
                    
                    if (!this.hasExploded && prevVy < 0 && this.vy >= 0) {
                        this.hasExploded = true;
                        this.explode();
                        return false;
                    }
                } else {
                    this.vx *= 0.97;
                    this.vy *= 0.97;
                    if (this.gravity) this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= this.decay;
                    if (this.alpha <= 0) return false;
                }
                return true;
            }

            draw() {
                if (this.type === 'rocket') {
                    for (let i = 0; i < this.trail.length; i++) {
                        ctx.fillStyle = `rgba(255,255,255,${i / this.trail.length})`;
                        ctx.fillRect(this.trail[i].x, this.trail[i].y, 2, 2);
                    }
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(this.x, this.y, 3, 3);
                } else {
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius || 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            explode() {
                for (let i = 0; i < 12; i++) {
                    particles.push(new Particle(this.x, this.y, '#ffffff', 'flash'));
                }
                const colors = ['#ffffff', '#ffd700', '#ffaa00', '#ffff88', '#ff6600'];
                for (let i = 0; i < 70; i++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(this.x, this.y, color, 'spark'));
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, W, H);
            
            particles = particles.filter(p => {
                const alive = p.update();
                if (alive) p.draw();
                return alive;
            });
        }

        function startFireworks() {
            canvas.style.display = 'block';
            animate();
            
            let count = 0;
            const interval = setInterval(() => {
                if (count >= 25) {
                    clearInterval(interval);
                    return;
                }
                const x = Math.random() * W * 0.8 + W * 0.1;
                particles.push(new Particle(x, H, '#ffffff', 'rocket'));
                count++;
            }, 300);
        }

        // Обработка нажатия "Да"
        document.getElementById('yesBtn').addEventListener('click', () => {
            const dialog = document.getElementById('dialog');
            dialog.style.opacity = '0';
            setTimeout(() => {
                dialog.style.display = 'none';
                document.body.style.background = '#050505';
                
                // Салют и окно успеха появляются ОДНОВРЕМЕННО
                startFireworks();
                document.getElementById('successOverlay').style.display = 'flex';
            }, 500);
        });

        // Кнопка "Продолжить сотрудничество"
        document.getElementById('continueBtn').addEventListener('click', () => {
            document.getElementById('successOverlay').style.display = 'none';
        });
    </script>
</body>
</html>
