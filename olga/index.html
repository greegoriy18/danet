<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Системное уведомление</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            background: #008080; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.8s ease; touch-action: none;
        }
        .window {
            background: #f0f0f0; border: 1px solid #000; box-shadow: 2px 2px 20px rgba(0,0,0,0.5);
            width: 90%; max-width: 340px; border-radius: 6px; overflow: hidden; transition: opacity 0.5s ease;
        }
        .title-bar {
            background: linear-gradient(to right, #0058ee, #3682ff); color: white;
            padding: 10px 14px; font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn {
            background: #e81123; border: none; color: white; width: 24px; height: 24px;
            font-size: 16px; line-height: 22px; text-align: center; cursor: pointer; border-radius: 3px;
        }
        .content {
            padding: 25px 18px; display: flex; align-items: center; gap: 15px;
            font-size: 17px; color: #000; border-bottom: 1px solid #dfdfdf;
        }
        .icon { font-size: 40px; }
        .buttons { padding: 18px 18px 22px; display: flex; justify-content: flex-end; gap: 12px; position: relative; }
        .btn {
            padding: 10px 22px; font-size: 16px; cursor: pointer; background: #e1e1e1;
            border: 1px solid #adadad; border-radius: 5px; min-width: 90px; font-weight: 500;
            transition: transform 0.15s ease-out, left 0.2s ease-out, top 0.2s ease-out;
        }
        .btn:active { background: #b0b0b0; transform: scale(0.96); }
        #yesBtn { background: #0078d7; color: white; border-color: #0078d7; font-weight: bold; }
        #yesBtn:active { background: #005a9e; }
        #noBtn { position: relative; }
        #noBtn.running { position: fixed; z-index: 100; transition: left 0.25s ease-out, top 0.25s ease-out; }
        #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none; }
    </style>
</head>
<body>
    <div id="dialog" class="window">
        <div class="title-bar">
            <span>Коммерческое предложение</span>
            <button class="close-btn">×</button>
        </div>
        <div class="content">
            <div class="icon">💼</div>
            <div>Ольга, вы купите мою систему?</div>
        </div>
        <div class="buttons">
            <button id="yesBtn" class="btn">Да</button>
            <button id="noBtn" class="btn">Нет</button>
        </div>
    </div>
    <canvas id="fireworks"></canvas>

    <script>
        const noBtn = document.getElementById('noBtn');
        const dialog = document.getElementById('dialog');
        let isRunning = false;

        function runAway() {
            if (!isRunning) {
                const rect = noBtn.getBoundingClientRect();
                noBtn.style.width = rect.width + 'px';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.top = rect.top + 'px';
                noBtn.classList.add('running');
                isRunning = true;
            }
            const maxX = window.innerWidth - noBtn.offsetWidth - 10;
            const maxY = window.innerHeight - noBtn.offsetHeight - 10;
            noBtn.style.left = (Math.random() * maxX + 5) + 'px';
            noBtn.style.top = (Math.random() * maxY + 5) + 'px';
        }

        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); }, { passive: false });
        noBtn.addEventListener('mouseenter', runAway);
        document.addEventListener('touchmove', (e) => {
            if (!isRunning) return;
            const touch = e.touches[0];
            const rect = noBtn.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + rect.width / 2);
            const dy = touch.clientY - (rect.top + rect.height / 2);
            if (Math.sqrt(dx*dx + dy*dy) < 80) runAway();
        }, { passive: true });

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [], fireworksActive = false;
        
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor(x, y, color, isRocket = false, isFlash = false) {
                this.x = x; this.y = y; this.color = color; this.isRocket = isRocket; this.isFlash = isFlash;
                
                if (isRocket) {
                    this.targetY = Math.random() * H * 0.3 + 50;
                    this.vy = -(Math.random() * 5 + 8); // Быстрее взлетает
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.trail = [];
                } else if (isFlash) {
                    // Резкая вспышка в центре
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = 0.08; // Очень быстро гаснет
                    this.radius = Math.random() * 4 + 3;
                    this.gravity = 0;
                } else {
                    // Искры петарды
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 3; // Высокая скорость разлёта
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.radius = Math.random() * 1.5 + 0.5; // Мелкие частицы
                    this.gravity = 0.15; // Сильная гравитация (искра падает вниз)
                    this.flicker = Math.random() > 0.5; // Эффект мерцания (треска)
                }
            }

            update() {
                if (this.isRocket) {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 5) this.trail.shift();
                    this.x += this.vx; this.y += this.vy; this.vy += 0.1;
                    if (this.vy >= 0 || this.y <= this.targetY) { 
                        this.explode(); 
                        return false; 
                    }
                } else {
                    this.vx *= 0.96; // Сопротивление воздуха
                    this.vy *= 0.96;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // Эффект мерцания (треск петарды)
                    if (this.flicker && Math.random() > 0.7) {
                        this.alpha = Math.random() * 0.5 + 0.5;
                    } else {
                        this.alpha -= this.decay;
                    }
                    
                    if (this.alpha <= 0) return false;
                }
                return true;
            }

            draw() {
                if (this.isRocket) {
                    for (let i = 0; i < this.trail.length; i++) {
                        ctx.fillStyle = `rgba(255,255,255,${i / this.trail.length})`;
                        ctx.fillRect(this.trail[i].x, this.trail[i].y, 2, 2);
                    }
                    ctx.fillStyle = '#fff'; ctx.fillRect(this.x, this.y, 3, 3);
                } else {
                    ctx.globalAlpha = this.alpha; 
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); 
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); 
                    ctx.fill(); 
                    ctx.globalAlpha = 1;
                }
            }

            explode() {
                // 1. Яркая центральная вспышка
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(this.x, this.y, '#ffffff', false, true));
                }
                // 2. Россыпь искр (золото, серебро, белый)
                const sparkColors = ['#ffffff', '#ffd700', '#e0e0e0', '#ffffaa'];
                for (let i = 0; i < 80; i++) {
                    const color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                    particles.push(new Particle(this.x, this.y, color, false, false));
                }
            }
        }

        function animate() {
            if (!fireworksActive && particles.length === 0) return;
            requestAnimationFrame(animate);
            // Более тёмный след для контраста ярких искр
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; 
            ctx.fillRect(0, 0, W, H);
            
            particles = particles.filter(p => { 
                const alive = p.update(); 
                if (alive) p.draw(); 
                return alive; 
            });
        }

        function startFireworks() {
            canvas.style.display = 'block'; 
            fireworksActive = true; 
            animate();
            
            let count = 0;
            const interval = setInterval(() => {
                if (count > 25) { // Меньше залпов, но каждый мощный
                    clearInterval(interval); 
                    fireworksActive = false; 
                    return; 
                }
                const x = Math.random() * W * 0.8 + W * 0.1;
                particles.push(new Particle(x, H, '#ffffff', true, false));
                count++;
            }, 400); // Чуть реже, чтобы каждый взрыв был акцентирован
        }

        document.getElementById('yesBtn').addEventListener('click', () => {
            dialog.style.opacity = '0';
            setTimeout(() => { 
                dialog.style.display = 'none'; 
                document.body.style.background = '#050505'; // Почти чёрный фон для максимального контраста искр
                startFireworks(); 
            }, 500);
        });
        
        document.querySelector('.close-btn').addEventListener('click', () => alert('А вот и не угадал! Нажимай "Да" 😉'));
    </script>
</body>
</html>
