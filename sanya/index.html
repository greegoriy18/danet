<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Системное уведомление</title>
    <style>
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #008080;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.8s ease;
            touch-action: none;
        }

        .window {
            background: #f0f0f0;
            border: 1px solid #000;
            box-shadow: 2px 2px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 340px;
            border-radius: 6px;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        .title-bar {
            background: linear-gradient(to right, #0058ee, #3682ff);
            color: white;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #e81123;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            font-size: 16px;
            line-height: 22px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
        }

        .content {
            padding: 25px 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 17px;
            color: #000;
            border-bottom: 1px solid #dfdfdf;
        }

        .icon { font-size: 40px; }

        .buttons {
            padding: 18px 18px 22px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            position: relative;
        }

        .btn {
            padding: 10px 22px;
            font-size: 16px;
            cursor: pointer;
            background: #e1e1e1;
            border: 1px solid #adadad;
            border-radius: 5px;
            min-width: 90px;
            font-weight: 500;
            transition: transform 0.15s ease-out, left 0.2s ease-out, top 0.2s ease-out;
        }
        .btn:active {
            background: #b0b0b0;
            transform: scale(0.96);
        }

        #yesBtn {
            background: #0078d7;
            color: white;
            border-color: #0078d7;
            font-weight: bold;
        }
        #yesBtn:active { background: #005a9e; }

        #noBtn {
            position: relative;
        }
        #noBtn.running {
            position: fixed;
            z-index: 100;
            transition: left 0.25s ease-out, top 0.25s ease-out;
        }

        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <div id="dialog" class="window">
        <div class="title-bar">
            <span>Финансовый вопрос</span>
            <button class="close-btn">×</button>
        </div>
        <div class="content">
            <div class="icon">💸</div>
            <div>ты дашь мне денег?</div>
        </div>
        <div class="buttons">
            <button id="yesBtn" class="btn">Да</button>
            <button id="noBtn" class="btn">Нет</button>
        </div>
    </div>

    <canvas id="fireworks"></canvas>

    <script>
        const noBtn = document.getElementById('noBtn');
        const dialog = document.getElementById('dialog');
        let isRunning = false;

        function runAway() {
            if (!isRunning) {
                const rect = noBtn.getBoundingClientRect();
                noBtn.style.width = rect.width + 'px';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.top = rect.top + 'px';
                noBtn.classList.add('running');
                isRunning = true;
            }
            
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 10;
            const maxY = window.innerHeight - btnHeight - 10;
            
            const newX = Math.random() * maxX + 5;
            const newY = Math.random() * maxY + 5;
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            runAway();
        }, { passive: false });

        noBtn.addEventListener('mouseenter', runAway);

        document.addEventListener('touchmove', function(e) {
            if (!isRunning) return;
            const touch = e.touches[0];
            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;
            const dx = touch.clientX - btnCenterX;
            const dy = touch.clientY - btnCenterY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            if (distance < 80) {
                runAway();
            }
        }, { passive: true });

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        
        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 300));

        let particles = [];
        let fireworksActive = false;

        class Particle {
            constructor(x, y, color, isRocket = false) {
                this.x = x;
                this.y = y;
                this.isRocket = isRocket;
                this.color = color;
                
                if (isRocket) {
                    this.targetY = Math.random() * H * 0.4 + 50;
                    this.vy = -(Math.random() * 4 + 6);
                    this.vx = (Math.random() - 0.5) * 2;
                    this.trail = [];
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.008;
                    this.gravity = 0.06;
                }
            }

            update() {
                if (this.isRocket) {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 6) this.trail.shift();
                    
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.08;
                    
                    if (this.vy >= 0 || this.y <= this.targetY) {
                        this.explode();
                        return false;
                    }
                } else {
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= this.decay;
                    if (this.alpha <= 0) return false;
                }
                return true;
            }

            draw() {
                if (this.isRocket) {
                    for (let i = 0; i < this.trail.length; i++) {
                        ctx.fillStyle = `rgba(255,255,255,${i / this.trail.length})`;
                        ctx.fillRect(this.trail[i].x, this.trail[i].y, 2, 2);
                    }
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(this.x, this.y, 3, 3);
                } else {
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            explode() {
                // Золотисто-зелёная палитра — в тему денег 💰
                const colors = ['#00cc66', '#ffd700', '#ffcc00', '#66ff66', '#ffffff', '#ff9900'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = 70;
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(this.x, this.y, color, false));
                }
            }
        }

        function animate() {
            if (!fireworksActive && particles.length === 0) return;
            
            requestAnimationFrame(animate);
            
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, W, H);

            particles = particles.filter(p => {
                const alive = p.update();
                if (alive) p.draw();
                return alive;
            });
        }

        function startFireworks() {
            canvas.style.display = 'block';
            fireworksActive = true;
            animate();
            
            let count = 0;
            const interval = setInterval(() => {
                if (count > 35) {
                    clearInterval(interval);
                    fireworksActive = false;
                    return;
                }
                const x = Math.random() * W * 0.8 + W * 0.1;
                const y = H;
                particles.push(new Particle(x, y, '#fff', true));
                count++;
            }, 300);
        }

        const yesBtn = document.getElementById('yesBtn');
        yesBtn.addEventListener('click', function() {
            dialog.style.opacity = '0';
            setTimeout(() => {
                dialog.style.display = 'none';
                document.body.style.background = '#0a0a0a';
                startFireworks();
            }, 500);
        });
        
        document.querySelector('.close-btn').addEventListener('click', function() {
            alert('А вот и не угадал! Нажимай "Да" 😉');
        });

        let lastTouch = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouch <= 300) e.preventDefault();
            lastTouch = now;
        }, { passive: false });
    </script>
</body>
</html>
